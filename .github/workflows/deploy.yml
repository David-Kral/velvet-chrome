name: Deploy to GitHub Pages

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build

      - name: Find output directory and prepare for Pages
        run: |
          if [ -f "dist/client/index.html" ]; then
            echo "DEPLOY_PATH=dist/client" >> $GITHUB_ENV
            cp dist/client/index.html dist/client/404.html
          elif [ -f "dist/index.html" ]; then
            echo "DEPLOY_PATH=dist" >> $GITHUB_ENV
            cp dist/index.html dist/404.html
          e