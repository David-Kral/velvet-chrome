name: Deploy to GitHub Pages

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build

      - name: Start Cloudflare Worker and prerender pages
        run: |
          # Start worker locally from dist/server/ (uses its wrangler.json)
          cd dist/server
          npx --yes wrangler@latest dev --port 8787 --local 2>&1 | tee /tmp/wrangler.log &
          WRANGLER_PID=$!
          cd ../..

          # Wait up to 60s for worker to respond
          echo "Waiting for worker to start..."
          for i in $(seq 1 60); do
            curl -sf http://localhost:8787/velvet-chrome/ > /dev/null 2>&1 && echo "Worker ready after ${i}s" && break
            sleep 1
          done

          if ! curl -sf http://localhost:8787/velvet-chrome/ > /dev/null 2>&1; then
            echo "ERROR: Worker did not start. Wrangler log:"
            cat /tmp/wrangler.log
            exit 1
          fi

          # Prerender all routes
          mkdir -p dist/gh-pages
          FAILED=0
          for route in "" galerie sluzby o-nas tym kontakt; do
            if [ -z "$route" ]; then
              url="http://localhost:8787/velvet-chrome/"
              out="dist/gh-pages/index.html"
            else
              url="http://localhost:8787/velvet-chrome/$route"
              mkdir -p "dist/gh-pages/$route"
              out="dist/gh-pages/$route/index.html"
            fi
            curl -sf "$url" -o "$out" \
              && echo "OK: $url" \
              || { echo "FAIL: $url"; FAILED=1; }
          done

          kill $WRANGLER_PID 2>/dev/null || true

          [ $FAILED -ne 0 ] && { echo "Some routes failed"; exit 1; }

          # Copy client-side assets (JS, CSS, images)
          cp -r dist/client/assets dist/gh-pages/assets

          # 404 fallback page for SPA navigation
          cp dist/gh-pages/index.html dist/gh-pages/404.html

          echo "DEPLOY_PATH=dist/gh-pages" >> $GITHUB_ENV

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './${{ env.DEPLOY_PATH }}'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
